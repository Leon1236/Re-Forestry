# Gradle heap. Keep this modest: this PC has ~6.6G RAM, and runClient
# also starts a separate Minecraft JVM. 4G here plus 4G for the game OOMs.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.0.1-26.2
maven_group=com.leon1236.reforestry

# Dependencies
fabric_api_version=0.155.2+26.2
energy_version=5.0.0
jei_version=30.14.0.94
